name: Daily AI News Aggregator

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST (Asia/Kolkata) every single day
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  refresh-news:
    name: Refresh Daily Top 5 AI News
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily AI News Refresh
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://yourdevelopers.in' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering automated daily AI news refresh at $(date -u) UTC..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${APP_URL}/api/cron/ai-news" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          echo "Response code: $HTTP_CODE"
          echo "Response body: $HTTP_BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::News refresh failed with HTTP status $HTTP_CODE"
            exit 1
          fi
          
          echo "Daily AI News refreshed successfully!"
